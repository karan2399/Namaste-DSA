  <body>
    <script>
      // Write a function that search the element in the array and returns the index, if not present, just return -1
      let arr = [4, 2, 0, 10, 8, 30];

      function searchElement(arr, x) {
        for (let i = 0; i < arr.length; i++) {
          if (arr[i] === x) {
            return i;
          }
        }
        return -1;
      }
      console.log(searchElement(arr, 103));
    </script>
  </body>
